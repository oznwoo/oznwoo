name: Duolingo README Stats Action

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC every day
  workflow_dispatch:

jobs:
  update-readme:
    name: Update readme with duolingo stats
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Duolingo stats and update README
        env:
          DUOLINGO_USER_ID: ${{ secrets.DUOLINGO_USER_ID }}
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}
        run: python3 scripts/update_duolingo_stats.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "💬 Updated README with Duolingo stats"
          commit_user_name: duolingo-stats-bot
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
